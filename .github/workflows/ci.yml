name: CI

on:
  push:
    # `dev` is the integration branch — every PR lands here first, so it needs CI
    # on merge. It was missing, which meant work could reach `dev` unverified.
    # `master` is deliberately absent: it is 108 commits behind `main` with no
    # unique commits, i.e. abandoned. `main` is the default branch and the one
    # the marketplace resolves against.
    branches: [main, dev]
  pull_request:
  # Lets CI be run by hand against any branch. Without this there is no way to
  # confirm the workflow still fires except by pushing a commit and hoping.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: plugin tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # Pure-stdlib hooks; the only test dependencies are pytest and PyYAML
        # (used to parse SKILL.md frontmatter). No package to build, no lockfile.
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Consumer-facing guarantees
        # These protect anyone who installs the plugin: plugin structure /
        # frontmatter / command-skill wiring, the SKILL.md shape rules, and the
        # runtime behavior of the four hooks that read your data and notebooks.
        run: python -m pytest

      - name: Skill routing (Tier 2)
        # Free, deterministic check that the right skill is reachable from how a
        # user actually phrases the ask, and that no two descriptions collide.
        # The floor is set below the achieved baseline so an unrelated description
        # edit doesn't turn CI red. Raise it as routing improves; never lower it
        # to make a regression pass. See benchmarks/evals/routing-baseline.md.
        # Bare --min-rank1 uses the floor declared in route_check.py, which the
        # pytest suite also reads — one number, not two hand-mirrored copies.
        run: python benchmarks/evals/scripts/route_check.py --min-rank1
